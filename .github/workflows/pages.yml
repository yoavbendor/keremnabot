# Publishes a self-contained knowledge-graph + ontology explorer to GitHub
# Pages. Zero secrets, zero LLM calls -- build_explorer.py is a pure data
# transform: it splices this repo's already-built heb-graph/*.json into
# explorer_template.html (vendored here from nanonto's generic template --
# not fetched at build time, so this repo's Pages build never depends on
# nanonto's visibility or availability) and disables the template's
# unrelated built-in chat panel.

name: Deploy KG explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "heb-graph/**"
      - "build_explorer.py"
      - "explorer_template.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the explorer page
        run: |
          mkdir -p _site
          python3 build_explorer.py \
            --template explorer_template.html \
            --graph heb-graph/graph.json \
            --ontology heb-graph/ontology.json \
            --chunks heb-graph/chunks.json \
            --label "Hebrew corpus (KeremNavotHeb)" \
            --build-version "${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --out _site/index.html

      # enablement: true -- Pages was never turned on for this repo (no one
      # had visited Settings > Pages yet); without this, configure-pages
      # fails with "Get Pages site failed... Not Found" instead of creating
      # the site. Only matters on the very first successful run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
